name: Deploy to Docker Hub

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install
          bun install --cwd apps/client
          bun install --cwd apps/server

      - name: Client TypeScript/build check
        run: bun run --cwd apps/client build

      - name: Server TypeScript check
        run: bun run --cwd apps/server build

      - name: Set commit SHA
        id: vars
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build client image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat-client:${{ steps.vars.outputs.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat-client:latest \
            -f apps/client/Dockerfile .

      - name: Build server image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat-server:${{ steps.vars.outputs.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat-server:latest \
            -f apps/server/Dockerfile .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat-client:${{ steps.vars.outputs.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat-client:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat-server:${{ steps.vars.outputs.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat-server:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/realtime-chat
            export IMAGE_TAG=${{ steps.vars.outputs.sha }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat-client:${{ steps.vars.outputs.sha }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/realtime-chat-server:${{ steps.vars.outputs.sha }}
            IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.yml up -d
            sleep 5
            curl -sf http://localhost:3002/api/health || exit 1
