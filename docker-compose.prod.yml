services:
  client:
    image: devashishbelwal/realtime-chat-client:${IMAGE_TAG:-latest}
    ports:
      - "8080:80"
    networks:
      - chat-net
    restart: unless-stopped

  server:
    image: devashishbelwal/realtime-chat-server:${IMAGE_TAG:-latest}
    ports:
      - "3002:3002"
    env_file: .env
    networks:
      - chat-net
    restart: unless-stopped

networks:
  chat-net:
